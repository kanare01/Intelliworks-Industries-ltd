    <script>
      (function() {
        try {
          var targetObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : null);
          if (targetObj) {
            var origFetch = targetObj.fetch;
            var activeFetch = origFetch ? function() {
              return origFetch.apply(this || targetObj, arguments);
            } : null;

            // Ensure window.fetch has both a getter and a setter so reassignments or wrapping don't throw
            Object.defineProperty(targetObj, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            });

            if (typeof globalThis !== 'undefined' && globalThis !== targetObj) {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {

        }
